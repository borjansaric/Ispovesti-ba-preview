name: Build Ispovesti.ba Admin Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "admin-android/**"
      - ".github/workflows/build-admin-apk.yml"

permissions:
  contents: read

concurrency:
  group: ispovesti-admin-apk
  cancel-in-progress: true

jobs:
  build-admin-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: admin-android
        run: gradle assembleDebug --no-daemon
      - name: Upload private admin APK
        uses: actions/upload-artifact@v4
        with:
          name: ispovesti-admin-preview-apk
          path: admin-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
