name: Preview pull request checks

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check scripts/build.mjs
          node --check scripts/check-preview-isolation.mjs
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -not -path './.asset-cache/*' -not -path './dist/*' -print0)

      - name: Verify preview environment isolation
        run: node scripts/check-preview-isolation.mjs

      - name: Verify pending submission storage
        run: node scripts/check-pending-submissions.mjs

      - name: Build preview without deploying
        run: node scripts/build.mjs
