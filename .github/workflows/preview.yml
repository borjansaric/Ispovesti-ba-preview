name: Deploy isolated Ispovesti preview
# Preview-only deployment. Each run attempt gets its own artifact name so retries
# cannot collide with artifacts retained from earlier attempts.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Restore previous fingerprinted assets
        uses: actions/cache@v4
        with:
          path: .asset-cache
          key: preview-fingerprinted-assets-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            preview-fingerprinted-assets-

      - name: Check JavaScript syntax and build preview
        run: |
          node --check scripts/build.mjs
          while IFS= read -r -d '' file; do echo "Checking $file"; node --input-type=module --check < "$file"; done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -not -path './.asset-cache/*' -not -path './dist/*' -print0)
          node scripts/check-preview-isolation.mjs
          node --test supabase/functions/chat-test-api/moderation.test.mjs
          node scripts/check-admin-report-audit-contract.mjs
          node scripts/build.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload preview files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait for unique Pages artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 24); do
            count=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT_NAME" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).total_count||0))}catch{process.stdout.write('0')}})")
            if [ "$count" -eq 1 ]; then echo "Unique Pages artifact is indexed."; exit 0; fi
            if [ "$count" -gt 1 ]; then echo "Unexpected duplicate unique Pages artifacts were found."; exit 1; fi
            echo "Artifact not indexed yet (attempt $attempt/24); waiting 5 seconds."
            sleep 5
          done
          echo "Pages artifact did not become visible in time."
          exit 1

      - name: Deploy preview only
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
