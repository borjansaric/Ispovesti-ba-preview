name: Deploy isolated Ispovesti preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Restore previous fingerprinted assets
        uses: actions/cache@v4
        with:
          path: .asset-cache
          key: preview-fingerprinted-assets-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            preview-fingerprinted-assets-

      - name: Build preview with content-hashed assets
        run: |
          node --check scripts/build.mjs
          node scripts/build.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload preview files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          name: preview-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy preview only
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: preview-pages-${{ github.run_id }}-${{ github.run_attempt }}
